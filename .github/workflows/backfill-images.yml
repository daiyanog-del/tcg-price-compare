# 承認済み・画像未登録カードの画像バックフィル
# 承認時の画像取得が（bulk-approve のバックグラウンド取得中断・一時的な
# ネットワーク失敗等で）こぼれたカードを定期的に拾い直すセーフティネット。
# 即時検知・手動リカバリは管理画面の「画像なし」バッジ＋ワンクリック取込で行い、
# こちらは原因を問わず自動回収する保険として動く。

name: Backfill Missing Card Images

on:
  schedule:
    - cron: '0 */3 * * *'  # 3時間ごと
  workflow_dispatch:        # 手動実行ボタン

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # refetch スクリプトは admin_unreleased を import するため
      # アプリの依存関係（flask 等）一式が必要
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill missing images
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python tools/refetch_missing_images.py

      # 型番（card_number）が空の未発売カードを、遊戯王Wikiのパックのページ（カード名 → 型番）で埋める（2026-10-30）。
      # 取り込み時に公式画像のURL・AI の読みで決まらなかったカードを、Wiki に載った時点で拾う。AI は使わない（費用なし）。
      # 空の行がある商品のページだけ読む。値がある行は変えない
      - name: Backfill card numbers from wiki
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python tools/backfill_card_number.py --wiki

      # 画像回収の後段: 承認済み・未投稿の未発売カードを X に投稿する（取りこぼしの回収）。
      # UNRELEASED_X_POST_ENABLED が 1 でなければ何もしない（既定は無効）。
      - name: Post unreleased cards to X
        if: ${{ !cancelled() }}  # 画像回収が一部失敗しても、画像のあるカードの投稿は進める
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          # 投稿に載せるサイトのURL（独自ドメイン・2026-10-21）。未設定なら旧URL
          CANONICAL_BASE_URL: ${{ vars.CANONICAL_BASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          UNRELEASED_X_POST_ENABLED: ${{ vars.UNRELEASED_X_POST_ENABLED }}
        run: python tools/post_unreleased_x.py
