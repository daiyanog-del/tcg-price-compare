# カード名データベース自動更新
# 毎週月曜 午前0時 (UTC) = 日本時間 午前9時 に実行
# 手動実行も可能 (Actions タブ → Run workflow)

name: Update Card Names

on:
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 UTC 0:00
  workflow_dispatch:       # 手動実行ボタン

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Update card names
        run: python update_cardnames.py

      - name: Reconcile unreleased cards
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python reconcile_unreleased.py

      # 更新後のマスタで全テストを回してから自動コミットする
      # （「マスタの『』基底名衝突」等の不変条件テストを自動更新にも効かせる。2026-08-06）
      - name: Run pytest
        run: python -m pytest tests -q

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet -- data/cardnames_ja.json data/cardnames_reading.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cardnames_ja.json data/cardnames_reading.json
          git commit -m "カード名データベース自動更新 $(date '+%Y-%m-%d')"
          git push
