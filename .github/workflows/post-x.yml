# X（Twitter）自動投稿
# 毎日 JST 21:00前後 に大変動カード（急騰・急落）の単発投稿を実行（2026-07-10〜新形式。価格収集は collect-prices.yml が担当）
# 手動実行時は dry_run を有効にすると本番投稿をスキップできる

name: Post X Big Movers

on:
  # 2026-07-10 schedule停止: 騰落率ロジックに偽陽性が確定したため（実例:
  # 「ブラックマジシャン(プリシク)」+489% は中黒表記ゆれで分裂した単一店舗系列の
  # 在庫入れ替わりで、他店の同カードは¥780横ばい）。前提監査の完了と対策実装まで
  # 自動投稿しない。手動実行（workflow_dispatch）は残す。docs/decisions.md 参照
  # schedule:
  #   - cron: '7 11 * * *'  # 毎日 UTC 11:07 = JST 20:07（毎時0分は混雑するため数分ずらす）
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'X投稿をスキップしてログのみ確認（チェックを入れると本番Xに投稿しない）'
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests supabase tweepy

      - name: Post big movers to X
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_POST_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python x_poster.py
