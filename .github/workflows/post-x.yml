# X（Twitter）自動投稿
# 毎日 JST 21:00前後 に大変動カード（急騰・急落）の単発投稿を実行（2026-07-10〜新形式。価格収集は collect-prices.yml が担当）
# 手動実行時は dry_run を有効にすると本番投稿をスキップできる

name: Post X Big Movers

on:
  # 2026-07-10 schedule再開: 偽陽性98%の原因に2ガード（共通店舗・複数店同方向）を
  # 導入し本番検証済み。閾値もガード後の分布で再校正（±500円/±30%）。
  # 撤退ゲートは2026-09-15頃に判定。docs/decisions.md 参照
  #
  # ★2026-08-03 停止 → 2026-09-01 時点で**停止したまま約1ヶ月放置**されている。
  #   停止した理由（当時）: トレコロ／カーナベルの検索語修正で、これまで取得
  #   できていなかった安い出品が新たに記録され、実際には値下がりしていない
  #   カードが「急落」として投稿されてしまうため。
  #   再開条件は「get_price_movers の比較窓が3日なので、収集4回分を過ぎたら」で、
  #   **2026-08-07〜09 には満たされていた**。単に戻し忘れている。
  #
  # 再開するには: 下の schedule: のコメントを外すだけでよい。
  #   ただし撤退ゲート（当初2026-09-15頃）は**実際に投稿が出てから測り直すこと**。
  #   止まったままの状態で「効果が無い」と判定してはいけない。
  #
  # 2026-09-01 の実測（13日ぶんのリプレイ・docs/decisions.md 参照）:
  #   X の条件（比較窓3日・±500円かつ±30%・複数店同方向）で候補は 1日あたり約1.4件。
  #   フィルタが厳しすぎて0件になっているのではなく、cron が止まっているだけ。
  #
  # ⚠ サイトのトップに出している値動きランキングは**別の関数**（get_top_movers）で、
  #   ガードの構成が違う。「サイトに出ているのにXが投稿しない」のは仕様。
  #   経緯と実測値は docs/decisions.md の 2026-09-01 の項を読むこと。
  # schedule:
  #   - cron: '7 11 * * *'  # 毎日 UTC 11:07 = JST 20:07（毎時0分は混雑するため数分ずらす）
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'X投稿をスキップしてログのみ確認（チェックを入れると本番Xに投稿しない）'
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests supabase tweepy

      - name: Post big movers to X
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_POST_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python x_poster.py
