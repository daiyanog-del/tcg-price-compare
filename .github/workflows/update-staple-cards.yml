# 汎用カードのリストを作り直す（2026-10-21〜・staple_cards.py）
# TCG PORTAL の大会結果（レシピ付き・直近90日）を全部読み、3テーマ以上で採用のカードを staple_cards に保存。
# 1回で約120ページ読むため週1回（TCG PORTAL への負担を抑える）。

name: Update Staple Cards

on:
  schedule:
    - cron: '30 1 * * 1'  # 毎週月曜 UTC 1:30 = JST 10:30
  workflow_dispatch:
    inputs:
      dry_run:
        description: '保存せず表示だけ'
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests supabase beautifulsoup4

      - name: Rebuild staple list
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python staple_cards.py ${{ inputs.dry_run && '--dry-run' || '--update' }}
