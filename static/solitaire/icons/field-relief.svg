  </filter></defs>
  <g fill="none" stroke="#21232b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#engrave)"><circle cx="50" cy="50" r="36"/><path d="m50 23 8 19 19 8-19 8-8 19-8-19-19-8 19-8Z"/><circle cx="50" cy="50" r="4"/></g>
