<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 暗い彫り溝の上縁と、下縁の反射で浅い刻印を表現する。 -->
  <defs><filter id="engrave" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
    <feDropShadow dx="0" dy="1.4" stdDeviation="0.65" flood-color="#959baf" flood-opacity="0.48"/>
    <feDropShadow dx="0" dy="-1.3" stdDeviation="0.85" flood-color="#0d0e12" flood-opacity="0.95"/>
  </filter></defs>
